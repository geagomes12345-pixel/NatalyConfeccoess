name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ "principal", "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -o NatalyConfeccoes_APK_Automatico_CORRETO.zip  -d projeto
          cp -r projeto/.github .github_extraido 2>/dev/null || true

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        run: |
          cd projeto
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NatalyConfeccoes-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
